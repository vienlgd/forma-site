<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> <!-- correct rendering of text -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- display in mobile device -->
    <title>Forma | Sign in</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.png">
    <meta name="description" content="Discover everyday essentials at Forma!">

    <!-- Bootstrap 6.0.0-alpha.1 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    <!-- Forma Custom Stylesheet -->
    <link rel="stylesheet" href="css/style.bootstrap.css">

</head>
<body class="d-flex flex-column min-vh-100"> 

    <!-- ===== TOP NAVIGATION ===== -->
    <header class="site-header">
        <div class="container">
            <nav class="navbar site-nav d-flex align-items-center justify-content-between flex-wrap" aria-label="main-nav">
                <!-- logo image -->
                <a href="home-bootstrap.html" class="navbar-brand nav-brand">
                    <img src="assets/68fac.svg" alt="Forma Logo">
                </a>

                <!-- account and cart icons -->
                <div class="icon-nav d-flex align-items-center gap-3">
                    <a href="signin-bootstrap.html" aria-label="Account"><img src="assets/3dddd.svg" alt="Account"></a>
                    <a href="cart-bootstrap.html" aria-label="Cart"><img src="assets/b124b.svg" alt="Cart"></a>

                    <!-- mobile menu button -->
                    <button class="btn-icon navbar-toggler md:d-none" type="button"
                        onclick="document.getElementById('mobileMenu').classList.toggle('d-none')"
                        aria-controls="mobileMenu" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>

                <!-- mobile dropdown links -->
                <div id="mobileMenu" class="w-100 mt-3 d-none md:d-none">
                    <ul class="nav-list flex-column align-items-stretch gap-2">
                        <li><a class="nav-link w-100" href="home-bootstrap.html">Home</a></li>
                        <li><a class="nav-link w-100" href="shop-bootstrap.html">Shop</a></li>
                        <li><a class="nav-link w-100" href="about-bootstrap.html">About</a></li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>

    <main class="container flex-grow-1 pt-4 pb-5">
        <div class="row justify-content-center w-100">

            <!-- ===== SIGN IN FORM ===== -->
            <div class="signin-form-card col-12 sm:col-8 md:col-6 lg:col-5">
                <h1 class="form-card-title text-center mb-4">Sign In</h1>

                <form id="signin-form" class="signin-form" action="home-bootstrap.html" method="get"> 
                    <!-- email input -->
                    <div class="form-field mb-3">
                        <label for="email">Email <span class="required">*</span></label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="juandelacruz@gmail.com" required autocomplete="email">
                    </div>

                    <!-- password input -->
                    <div class="form-field mb-3">
                        <label for="password">Password <span class="required">*</span></label>
                        <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                    </div>
                    
                    <!-- submit button -->
                    <button class="signin-submit w-100 mt-2" type="submit">Sign In</button>
                </form>

                <!-- ==== LINKS ==== -->
                <div class="signin-links d-flex flex-column align-items-center gap-2 mt-5 pt-3">
                    <a href="signup-bootstrap.html">Create an account</a>
                </div>

            </div>

        </div>
    </main>

    <!-- ==== FOOTER ==== -->
    <footer class="signin-footer mt-auto">
        <div class="container">
            <ul class="footer-terms d-flex justify-content-center gap-3 list-unstyled py-4 mb-0">
                <li><a href="privacypolicy-bootstrap.html">Privacy Policy</a></li>
                <li>&middot;</li>
                <li><a href="privacypolicy-bootstrap.html">Terms &amp; Conditions</a></li>
            </ul>
        </div>
    </footer>

    <!-- Bootstrap 6 JavaScript (ESM Bundle) -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <!-- Header Tshirt Search Script -->
    <script src="search-bar.js"></script>
</body>
</html>
