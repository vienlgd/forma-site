<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> <!-- correct rendering of text -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- display in mobile device -->
    <title>Forma | Cart</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.png">
    <meta name="description" content="Forma Shopping Cart">

    <!-- Bootstrap 6.0.0-alpha.1 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    <!-- Forma Custom Stylesheet -->
    <link rel="stylesheet" href="css/style.bootstrap.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <!--top navigation-->
    <header class="site-header">
        <div class="container">
            <nav class="navbar site-nav d-flex align-items-center justify-content-between flex-wrap" aria-label="main-nav">
                <!--logo image-->
                <a href="home-bootstrap.html" class="navbar-brand nav-brand">
                    <img src="assets/68fac.svg" alt="Forma Logo">
                </a>

                <!--main nav buttons (Desktop)-->
                <ul class="nav-list d-none md:d-flex">
                    <li><a href="home-bootstrap.html" class="nav-link">Home</a></li>
                    <li><a href="shop-bootstrap.html" class="nav-link">Shop</a></li>
                    <li><a href="about-bootstrap.html" class="nav-link">About</a></li>
                </ul>

                <!--icon nav + mobile toggle-->
                <div class="icon-nav d-flex align-items-center gap-3">
                    <input type="text" placeholder="Search">
                    <a href="signin-bootstrap.html" aria-label="Account"><img src="assets/3dddd.svg" alt="Account"></a>
                    <a href="cart-bootstrap.html" aria-label="Cart"><img src="assets/b124b.svg" alt="Cart"></a>

                    <!-- Mobile Menu Toggle Button -->
                    <button class="btn-icon navbar-toggler md:d-none" type="button"
                        onclick="document.getElementById('mobileMenu').classList.toggle('d-none')"
                        aria-controls="mobileMenu" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>

                <!-- Mobile Dropdown Menu -->
                <div id="mobileMenu" class="w-100 mt-3 d-none md:d-none">
                    <ul class="nav-list flex-column align-items-stretch gap-2">
                        <li><a class="nav-link w-100" href="home-bootstrap.html">Home</a></li>
                        <li><a class="nav-link w-100" href="shop-bootstrap.html">Shop</a></li>
                        <li><a class="nav-link w-100" href="about-bootstrap.html">About</a></li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>

    <main class="flex-grow-1">
        <section class="cart-section container py-6">
            <div class="cart-header">
                <img src="assets/cart-hollow.png" alt="Cart Icon">
                <h1>Cart</h1>
            </div>
        
            <!--product on cart-->
            <div class="cart-product-list row g-5">
                <!--product 1-->
                <div class="col-12 sm:col-6 md:col-4">
                    <div class="shop-card cart-card" data-product-id="product-1">
                        <a href="shop-product1-bootstrap.html">
                            <img src="assets/thumbnail1-blue.png" class="img-fluid" alt="Everyday Comfort T-Shirt">
                        </a>
                        <div class="product-info d-flex justify-content-between align-items-end mt-3">
                            <div>
                                <a href="shop-product1-bootstrap.html" class="text-decoration-none">
                                    <h2 class="card-title">Everyday Comfort T-shirt</h2>
                                </a>
                                <p class="card-text">₱ 259</p>
                            </div>
                            <button type="button" class="cart-button added-button" aria-label="Remove from cart">
                                <img src="assets/cart-white.png" alt="Remove from cart">
                            </button>
                        </div>
                    </div>
                </div>

                <!--product 2-->
                <div class="col-12 sm:col-6 md:col-4">
                    <div class="shop-card cart-card" data-product-id="product-2">
                        <a href="shop-product2-bootstrap.html">
                            <img src="assets/thumbnail2-blue.png" class="img-fluid" alt="Do Good Work T-shirt">
                        </a>
                        <div class="product-info d-flex justify-content-between align-items-end mt-3">
                            <div>
                                <a href="shop-product2-bootstrap.html" class="text-decoration-none">
                                    <h2 class="card-title">Do Good Work T-shirt</h2>
                                </a>
                                <p class="card-text">₱ 259</p>
                            </div>
                            <button type="button" class="cart-button added-button" aria-label="Remove from cart">
                                <img src="assets/cart-white.png" alt="Remove from cart">
                            </button>
                        </div>
                    </div>
                </div>

                <!--product 3-->
                <div class="col-12 sm:col-6 md:col-4">
                    <div class="shop-card cart-card" data-product-id="product-3">
                        <a href="shop-product3-bootstrap.html">
                            <img src="assets/thumbnail3-blue.png" class="img-fluid" alt="Don't Be Late T-shirt">
                        </a>
                        <div class="product-info d-flex justify-content-between align-items-end mt-3">
                            <div>
                                <a href="shop-product3-bootstrap.html" class="text-decoration-none">
                                    <h2 class="card-title">Don't Be Late T-shirt</h2>
                                </a>
                                <p class="card-text">₱ 259</p>
                            </div>
                            <button type="button" class="cart-button added-button" aria-label="Remove from cart">
                                <img src="assets/cart-white.png" alt="Remove from cart">
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!--footer-->
    <footer class="site-footer mt-auto">
        <div class="container footer-container">

            <!--top row: logo | quick links | socials-->
            <div class="footer-top row align-items-start g-4">

                <!--logo + copyright-->
                <div class="footer-brand md:col-4">
                    <a href="home-bootstrap.html"><img src="assets/c5f08.svg" alt="Forma Wordmark"></a>
                    <p class="copyright">Forma &middot; &copy; 2026</p>
                </div>

                <!--quick links aligned cleanly under heading-->
                <nav class="footer-nav md:col-5" aria-label="Footer Navigation">
                    <h4 class="footer-nav-heading">Quick Links</h4>
                    <div class="d-flex gap-5">
                        <ul class="footer-links">
                            <li><a href="home-bootstrap.html">Home</a></li>
                            <li><a href="about-bootstrap.html">About</a></li>
                            <li><a href="contact-us-bootstrap.html">Contact</a></li>
                        </ul>
                        <ul class="footer-links">
                            <li><a href="shop-bootstrap.html">Shop</a></li>
                            <li><a href="favorites-bootstrap.html">Favorites/Likes</a></li>
                            <li><a href="cart-bootstrap.html">Cart</a></li>
                        </ul>
                    </div>
                </nav>

                <!--social media icons-->
                <div class="footer-socials md:col-3 d-flex gap-3 justify-content-md-end">
                    <a href="https://facebook.com" aria-label="Facebook"><ion-icon name="logo-facebook"></ion-icon></a>
                    <a href="https://instagram.com" aria-label="Instagram"><ion-icon name="logo-instagram"></ion-icon></a>
                    <a href="https://tiktok.com" aria-label="TikTok"><ion-icon name="logo-tiktok"></ion-icon></a>
                </div>

            </div>

            <!--bottom row: policies and terms-->
            <ul class="footer-terms d-flex gap-3 list-unstyled mt-4">
                <li><a href="privacypolicy-bootstrap.html">Privacy Policy</a></li>
                <li><a href="privacypolicy-bootstrap.html">Terms &amp; Conditions</a></li>
            </ul>

        </div>
    </footer>

    <!-- Bootstrap 6 JavaScript (ESM Bundle) -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

    <!-- Ionicons for Social Media Icons -->
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
    
    <!-- Header Tshirt Search Script -->
    <script src="search-bar.js"></script>

    <script src="forma-product.js"></script>

</body>
</html>
